
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kashimpur Go</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f5;
      color: #17251c;
    }
    header {
      background: #087c48;
      color: white;
      padding: 22px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 30px; }
    header p { margin-bottom: 0; }
    main {
      max-width: 650px;
      margin: 35px auto;
      padding: 20px;
    }
    .hero {
      background: white;
      border-radius: 16px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 3px 15px #00000010;
    }
    .hero h2 { color: #087c48; }
    .search {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-top: 20px;
      font-size: 16px;
    }
    footer {
      text-align: center;
      padding: 25px;
      color: #66736a;
    }
  </style>
</head>
<body>
  <header>
    <h1>Kashimpur Go</h1>
    <p>আপনার এলাকার অনলাইন মার্কেটপ্লেস</p>
  </header>

  <main>
    <section class="hero">
      <h2>স্বাগতম Kashimpur Go-তে!</h2>
      <p>আপনার প্রয়োজনীয় পণ্য খুঁজুন এক জায়গায়।</p>
      <input class="search" type="search"
        placeholder="পণ্য খুঁজুন...">
    </section>
  </main>

  <footer>
    © 2026 Kashimpur Go
  </footer>
</body>
</html>
